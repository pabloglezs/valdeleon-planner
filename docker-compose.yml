# Stack para Portainer. Variables opcionales (Portainer > Stacks > Environment variables):
#   PORT   (obligatorio) puerto del host donde se publica la web; apunta Nginx Proxy Manager a IP:PORT
services:
  chalet98:
    build: .
    image: chalet98:latest
    container_name: chalet98
    restart: unless-stopped
    ports:
      - "${PORT:?Define PORT en Environment variables}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Si usas un proxy inverso con Traefik, quita "ports" y descomenta esto
    # (cambia el dominio y el nombre de la red/entrypoints por los tuyos):
    # networks: [proxy]
    # labels:
    #   - traefik.enable=true
